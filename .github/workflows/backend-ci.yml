name: Backend CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install deps
        working-directory: backend
        run: npm install
      - name: Lint & build
        working-directory: backend
        run: npm run build || true
      - name: Upload docker image (placeholder)
        run: echo "Add container build & push steps here"
